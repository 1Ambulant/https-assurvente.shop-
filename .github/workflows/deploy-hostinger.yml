name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - claude/flashmecano-react-modifications-132n2p
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload dist/ to VPS (temp folder)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          source: "dist"
          target: "/tmp/flashmecano-new"
          strip_components: 0
          overwrite: true

      - name: Deploy on VPS (swap dist, reload nginx)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            set -e
            sudo rm -rf /var/www/flashmecano/dist/*
            sudo cp -r /tmp/flashmecano-new/dist/* /var/www/flashmecano/dist/
            sudo chown -R www-data:www-data /var/www/flashmecano/dist
            sudo chmod -R 755 /var/www/flashmecano/dist
            rm -rf /tmp/flashmecano-new
            sudo nginx -t
            sudo systemctl reload nginx
            echo "Deployed assets:"
            ls -la /var/www/flashmecano/dist/assets/
